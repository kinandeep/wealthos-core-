<script>
'use strict';

/* =========================================================
   1. الثوابت وأدوات التحقق
   ========================================================= */

const VERSION = '1.7.0';
const PRIMARY_KEY = 'haseef_v1_john_data';
const RECOVERY_KEY = 'haseef_before_import';
const MAX_MONEY = 1e12;
const MAX_DAY = 1000000;

const ALLOWED_CURRENCIES = [
  '$','€','£','ر.س','د.إ','د.أ','ج.م','ل.ل','ل.س'
];

const VALID_BASTIONS = [
  'GROUND_ZERO',
  'BREAK_EVEN',
  'TONIGHT_BASTION',
  'TOMORROW_BASTION',
  'WEEK_BASTION',
  'BUILDING_MONTH',
  'MONTH_BASTION'
];

const TYPES = [
  'INCOME_RECEIVED',
  'CASH_LOAN_RECEIVED',
  'CREDIT_PURCHASE_INCURRED',
  'CASH_TRANSFERRED',
  'EXPENSE_INCURRED',
  'OBLIGATION_PAID',
  'DAILY_AUDIT_COMMITTED',
  'MANUAL_BALANCE_ADJUSTMENT',
  'LEGACY_MIGRATION_INIT'
];

const CLASSES = [
  'ESSENTIAL',
  'EMERGENCY',
  'DISCRETIONARY'
];

const clone = x => JSON.parse(JSON.stringify(x));
const own = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const object = x =>
  x !== null && typeof x === 'object' && !Array.isArray(x);

function assert(ok,msg) {
  if (!ok) throw new Error(msg);
}

function escapeHtml(x) {
  return String(x ?? '').replace(/[&<>"']/g,c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

/* التحويل إلى وحدات نقدية صحيحة للحساب */
function cents(v,label='المبلغ',allowZero=true) {
  assert(
    typeof v === 'number' &&
    Number.isFinite(v) &&
    v >= 0 &&
    v <= MAX_MONEY,
    label + ': قيمة غير صالحة أو تتجاوز الحد المدعوم.'
  );

  const n = Math.round(v * 100);

  assert(
    Number.isSafeInteger(n) &&
    Math.abs(v - n / 100) <= Math.max(
      1e-9,
      Math.abs(v) * Number.EPSILON * 2
    ),
    label + ': استخدم منزلتين عشريتين كحد أقصى.'
  );

  assert(allowZero || n > 0,label + ': يجب أن يكون أكبر من صفر.');
  return n;
}

function validateAmount(v,label,allowZero=true) {
  return cents(v,label,allowZero) / 100;
}

function cash(n) {
  assert(
    Number.isSafeInteger(n) &&
    n >= 0 &&
    n <= MAX_MONEY * 100,
    'ناتج الحساب خارج الحدود المدعومة.'
  );
  return n / 100;
}

function sumMoney(arr) {
  return cash(arr.reduce((n,v) => n + cents(v),0));
}

function positiveDay(n,max=MAX_DAY) {
  return Number.isSafeInteger(n) && n >= 1 && n <= max;
}

function textField(x,max=1000) {
  return typeof x === 'string' &&
    x.trim().length > 0 &&
    x.length <= max;
}

function validId(x) {
  return typeof x === 'string' &&
    /^[A-Za-z0-9_-]{1,160}$/.test(x);
}

function timestamp(x) {
  return typeof x === 'string' &&
    Number.isFinite(Date.parse(x));
}

/* =========================================================
   2. الحسابات والحالة الأساسية
   ========================================================= */

function calc(s) {
  const liquid = sumMoney([
    s.buckets.operatingCash,
    s.buckets.protectedCash
  ]);

  const due = sumMoney(
    s.obligations
      .filter(o => o.critical)
      .map(o => o.outstanding)
  );

  const debt = sumMoney(
    s.obligations.map(o => o.outstanding)
  );

  const net = cents(liquid) - cents(due);

  const days = s.isConfigured
    ? Math.max(net,0) / cents(s.baseDailyBurn,'خرجية البيت',false)
    : 0;

  const gap = s.isConfigured
    ? Math.max(-net,0) / 100
    : 0;

  const bastion =
    gap > 0 ? 'GROUND_ZERO' :
    days === 0 ? 'BREAK_EVEN' :
    days < 1 ? 'TONIGHT_BASTION' :
    days < 2 ? 'TOMORROW_BASTION' :
    days < 7 ? 'WEEK_BASTION' :
    days < 30 ? 'BUILDING_MONTH' :
    'MONTH_BASTION';

  return {
    rawSafetyDays: days,
    safetyDays: days,
    criticalGap: gap,
    debtBurden: debt,
    criticalDue: due,
    totalLiquid: sumMoney([
      liquid,
      s.buckets.earmarkedCash
    ]),
    safetyEligibleLiquid: liquid,
    bastion
  };
}

function blank() {
  return {
    version: VERSION,
    brand: 'HASEEF',
    isConfigured: false,
    simDay: 1,
    dayStatus: 'OPEN',
    currency: '$',
    baseDailyBurn: 0,
    buckets: {
      operatingCash: 0,
      protectedCash: 0,
      earmarkedCash: 0
    },
    obligations: [],
    ledger: [],
    dailySnapshots: [],
    weekOpeningSnapshot: null
  };
}

/* =========================================================
   3. فحص اللقطات والحركات والدفتر
   ========================================================= */

function validateSnapshot(w,d,opening=false) {
  assert(object(w),'لقطة غير صالحة.');

  assert(
    positiveDay(w.day,d.simDay) ||
    (opening && w.day === null && d.historyIncomplete === true),
    'يوم اللقطة غير صالح.'
  );

  assert(
    VALID_BASTIONS.includes(w.bastion),
    'حالة اللقطة غير صالحة.'
  );

  for (const k of ['rawSafetyDays','safetyDays']) {
    assert(
      typeof w[k] === 'number' &&
      Number.isFinite(w[k]) &&
      w[k] >= 0,
      'أيام اللقطة غير صالحة.'
    );
  }

  for (const k of [
    'criticalGap',
    'debtBurden',
    'criticalDue',
    'totalLiquid',
    'safetyEligibleLiquid'
  ]) {
    cents(w[k],'رصيد اللقطة');
  }

  assert(
    w.criticalDue <= w.debtBurden &&
    w.safetyEligibleLiquid <= w.totalLiquid,
    'أرصدة اللقطة غير متسقة.'
  );

  assert(
    Math.abs(
      w.criticalGap -
      Math.max(w.criticalDue - w.safetyEligibleLiquid,0)
    ) < 1e-7,
    'فجوة اللقطة لا تطابق أرصدتها.'
  );

  assert(
    !(w.criticalGap > 0 && w.safetyDays > 0),
    'لقطة تجمع بين عجز وأيام أمان.'
  );

  const sd = w.rawSafetyDays;
  const expected =
    w.criticalGap > 0 ? 'GROUND_ZERO' :
    sd === 0 ? 'BREAK_EVEN' :
    sd < 1 ? 'TONIGHT_BASTION' :
    sd < 2 ? 'TOMORROW_BASTION' :
    sd < 7 ? 'WEEK_BASTION' :
    sd < 30 ? 'BUILDING_MONTH' :
    'MONTH_BASTION';

  assert(
    w.bastion === expected &&
    Math.abs(w.safetyDays - sd) < 1e-7,
    'تصنيف اللقطة غير متسق.'
  );

  if (!opening) {
    assert(
      w.dayStatus === 'SEALED',
      'اللقطة اليومية يجب أن تكون مغلقة.'
    );
  }
}

function validateState(d) {
  assert(
    object(d) &&
    d.version === VERSION &&
    d.brand === 'HASEEF',
    'إصدار الملف غير مدعوم.'
  );

  assert(
    typeof d.isConfigured === 'boolean',
    'حالة الإعداد غير صالحة.'
  );

  cents(d.baseDailyBurn,'خرجية البيت',!d.isConfigured);

  assert(
    ALLOWED_CURRENCIES.includes(d.currency),
    'العملة غير مدعومة؛ لم يتم تحويل الأرقام.'
  );

  assert(object(d.buckets),'أوعية السيولة مفقودة.');

  for (const k of [
    'operatingCash',
    'protectedCash',
    'earmarkedCash'
  ]) {
    cents(d.buckets[k],k);
  }

  assert(
    positiveDay(d.simDay) &&
    ['OPEN','SEALED'].includes(d.dayStatus),
    'اليوم غير صالح.'
  );

  for (const k of [
    'obligations',
    'ledger',
    'dailySnapshots'
  ]) {
    assert(
      Array.isArray(d[k]) && d[k].length <= 100000,
      'السجل ناقص أو كبير جداً.'
    );
  }

  if (own(d,'historyIncomplete')) {
    assert(
      typeof d.historyIncomplete === 'boolean',
      'علامة الترحيل غير صالحة.'
    );
  }

  const ids = new Set();

  for (const o of d.obligations) {
    assert(
      object(o) && validId(o.id) && !ids.has(o.id),
      'معرّف دين غير صالح أو مكرر.'
    );

    ids.add(o.id);

    assert(
      textField(o.title,200) &&
      typeof o.critical === 'boolean',
      'تفاصيل الدين غير صالحة.'
    );

    cents(o.outstanding,'الدين');
  }

  let previousDay = 0;
  const seals = new Set();

  for (const e of d.ledger) {
    assert(
      object(e) &&
      positiveDay(e.day,d.simDay) &&
      e.day >= previousDay &&
      TYPES.includes(e.type),
      'تسلسل السجل أو نوع الحركة غير صالح.'
    );

    previousDay = e.day;

    for (const k of [
      'amount',
      'oldVal',
      'newVal',
      'operatingDrained',
      'protectedDrained'
    ]) {
      if (own(e,k)) cents(e[k],'مبلغ الحركة');
    }

    if ([
      'INCOME_RECEIVED',
      'CASH_LOAN_RECEIVED',
      'CREDIT_PURCHASE_INCURRED',
      'CASH_TRANSFERRED',
      'EXPENSE_INCURRED',
      'OBLIGATION_PAID'
    ].includes(e.type)) {
      cents(e.amount,'مبلغ الحركة',false);
    }

    if (own(e,'timestamp')) {
      assert(timestamp(e.timestamp),'وقت الحركة غير صالح.');
    }

    if (own(e,'critical')) {
      assert(
        typeof e.critical === 'boolean',
        'تصنيف الدين غير صالح.'
      );
    }

    if (e.type === 'EXPENSE_INCURRED') {
      assert(
        CLASSES.includes(e.classification),
        'تصنيف مصروف مفقود.'
      );

      if (
        own(e,'operatingDrained') &&
        own(e,'protectedDrained')
      ) {
        assert(
          cents(e.operatingDrained) +
          cents(e.protectedDrained) ===
          cents(e.amount),
          'مصادر المصروف لا تساوي المبلغ.'
        );
      }
    }

    if (e.type === 'OBLIGATION_PAID') {
      assert(
        validId(e.obligationId) && ids.has(e.obligationId),
        'دين السداد غير موجود.'
      );
    }

    if (e.type === 'MANUAL_BALANCE_ADJUSTMENT') {
      cents(e.oldVal);
      cents(e.newVal);

      assert(
        textField(e.reason) && validId(e.id),
        'تصحيح ناقص.'
      );

      assert(
        (
          e.targetType === 'BUCKET' &&
          ['operatingCash','protectedCash'].includes(e.id)
        ) ||
        (
          e.targetType === 'CONFIG' &&
          e.id === 'baseDailyBurn'
        ) ||
        (
          e.targetType === 'OBLIGATION' &&
          ids.has(e.id)
        ),
        'هدف التصحيح غير صالح.'
      );

      if (e.targetType === 'CONFIG') {
        cents(e.newVal,'خرجية البيت',false);
      }
    }

    if (e.type === 'DAILY_AUDIT_COMMITTED') {
      assert(
        !seals.has(e.day) && timestamp(e.timestamp),
        'ختم مكرر أو بلا وقت.'
      );
      seals.add(e.day);
    }

    if (e.type === 'LEGACY_MIGRATION_INIT') {
      assert(
        textField(e.note,2000),
        'ملاحظة الترحيل مفقودة.'
      );
    }
  }

  let last = 0;
  const snapshotDays = new Set();

  for (const w of d.dailySnapshots) {
    validateSnapshot(w,d);
    assert(w.day > last,'لقطات مكررة أو غير مرتبة.');

    last = w.day;
    snapshotDays.add(w.day);

    assert(
      w.day < d.simDay || d.dayStatus === 'SEALED',
      'لقطة إغلاق ليوم مفتوح.'
    );
  }

  for (const day of seals) {
    assert(snapshotDays.has(day),'ختم يوم دون لقطة.');
  }

  if (!d.historyIncomplete) {
    for (const day of snapshotDays) {
      assert(seals.has(day),'لقطة دون ختم.');
    }

    assert(
      d.dailySnapshots.length ===
      d.simDay - (d.dayStatus === 'OPEN' ? 1 : 0),
      'أيام مفقودة من السجل.'
    );
  }

  if (d.dayStatus === 'SEALED') {
    assert(
      snapshotDays.has(d.simDay) ||
      (d.historyIncomplete && d.dailySnapshots.length === 0),
      'اليوم المغلق بلا لقطة.'
    );
  }

  if (
    d.weekOpeningSnapshot !== null &&
    d.weekOpeningSnapshot !== undefined
  ) {
    validateSnapshot(d.weekOpeningSnapshot,d,true);
  }

  calc(d);
  return d;
}

/* =========================================================
   4. ترحيل النسخ السابقة
   ========================================================= */

function migrateLegacyState(input) {
  assert(object(input),'ملف الدفتر غير صالح.');

  const d = clone(input);

  if (d.version === VERSION) {
    validateState(d);
    return d;
  }

  const known = ['1.6.0','1.6.1','1.6.2','1.6.3'];

  assert(
    (known.includes(d.version) && d.brand === 'HASEEF') ||
    (!own(d,'version') && !own(d,'brand')),
    'إصدار غير معروف؛ لن تتم إعادة تفسيره تلقائياً.'
  );

  const unversioned = !own(d,'version');

  assert(
    object(d.buckets) && Array.isArray(d.obligations),
    'أرصدة أو ديون النسخة السابقة مفقودة.'
  );

  if (!own(d,'currency') && unversioned) {
    d.currency = '$';
  }

  if (!own(d.buckets,'earmarkedCash') && unversioned) {
    d.buckets.earmarkedCash = 0;
  }

  d.historyIncomplete = true;

  if (!own(d,'ledger') && unversioned) {
    d.ledger = [];
  }

  if (!own(d,'dailySnapshots') && unversioned) {
    d.dailySnapshots = [];
  }

  assert(
    Array.isArray(d.ledger) &&
    Array.isArray(d.dailySnapshots),
    'تاريخ النسخة السابقة تالف.'
  );

  if (!own(d,'weekOpeningSnapshot')) {
    d.weekOpeningSnapshot = null;
  }

  if (
    object(d.weekOpeningSnapshot) &&
    !own(d.weekOpeningSnapshot,'day')
  ) {
    d.weekOpeningSnapshot.day = null;
  }

  for (const e of d.ledger) {
    if (
      object(e) &&
      e.type === 'EXPENSE_INCURRED' &&
      !own(e,'classification')
    ) {
      e.classification = 'ESSENTIAL';
      e.migrationNote =
        'تصنيف افتراضي لترحيل نسخة لم تحفظ التصنيف؛ ليس إثباتاً لطبيعة الإنفاق.';
    }
  }

  d.version = VERSION;
  d.brand = 'HASEEF';

  d.ledger.push({
    day: d.simDay,
    type: 'LEGACY_MIGRATION_INIT',
    note: 'تم حفظ الأرصدة والسجل المتاح. اكتمال التاريخ القديم غير مؤكد؛ تاريخ لقطة البداية قد يكون غير معروف.',
    timestamp: new Date().toISOString()
  });

  validateState(d);
  return d;
}

/* =========================================================
   5. محرك الدفتر والحفظ
   ========================================================= */

class WealthEngine {
  constructor(storage) {
    this.storage = storage;
    this.state = blank();
    this.expectedRaw = null;
    this.blocked = false;
  }

  getDeepSnapshot() {
    return clone(this.state);
  }

  commit(candidate) {
    assert(
      !this.blocked,
      'الدفتر محمي حتى معالجة مشكلة التحميل.'
    );

    validateState(candidate);

    const raw = JSON.stringify(candidate);
    let actual;

    try {
      actual = this.storage.getItem(PRIMARY_KEY);
    } catch (e) {
      throw new Error('تعذر قراءة التخزين؛ لم تُعتمد العملية.');
    }

    assert(
      actual === this.expectedRaw,
      'تغيّر الدفتر في نافذة أخرى. أعد تحميل الصفحة قبل المتابعة.'
    );

    try {
      this.storage.setItem(PRIMARY_KEY,raw);
    } catch (e) {
      throw new Error(
        'تعذر الحفظ؛ لم تتغير الأرصدة أو حالة اليوم. صدّر نسخة ثم تحقق من مساحة المتصفح.'
      );
    }

    this.state = clone(candidate);
    this.expectedRaw = raw;

    return calc(this.state);
  }

  load() {
    let raw;

    try {
      raw = this.storage.getItem(PRIMARY_KEY);
    } catch (e) {
      this.blocked = true;
      return {
        status:'STORAGE_ERROR',
        message:'تعذر الوصول للتخزين المحلي.'
      };
    }

    if (raw !== null) {
      try {
        const d = migrateLegacyState(JSON.parse(raw));

        this.state = d;
        this.expectedRaw = raw;
        this.blocked = false;

        return {status:'OK'};
      } catch (e) {
        this.blocked = true;
        return {
          status:'INVALID_DATA',
          message:e.message
        };
      }
    }

    for (const key of [
      'sanad_v1_john_data',
      'wealthos_v15_john_complete',
      'wealthos_john_data'
    ]) {
      try {
        const old = this.storage.getItem(key);
        if (old === null) continue;

        const d = migrateLegacyState(JSON.parse(old));
        const migratedRaw = JSON.stringify(d);

        this.storage.setItem(PRIMARY_KEY,migratedRaw);
        this.expectedRaw = migratedRaw;
        this.state = d;
        this.blocked = false;

        return {status:'OK',migrated:true};
      } catch (e) {
        this.blocked = true;
        return {
          status:'INVALID_DATA',
          message:'تعذر ترحيل دفتر سابق: ' + e.message
        };
      }
    }

    this.state = blank();
    this.expectedRaw = null;
    this.blocked = false;

    return {status:'EMPTY'};
  }

  setup(op,burn,prot,obligations) {
    assert(!this.state.isConfigured,'الدفتر مفتوح بالفعل.');

    const d = blank();

    d.isConfigured = true;
    d.baseDailyBurn = validateAmount(burn,'خرجية البيت',false);
    d.buckets.operatingCash = validateAmount(op,'كاش الجيبة');
    d.buckets.protectedCash = validateAmount(prot,'الاحتياطي');
    d.obligations = clone(obligations);

    d.weekOpeningSnapshot = {
      day:1,
      ...calc(d)
    };

    return this.commit(d);
  }

  applyAdjustment({targetType,id,newVal,reason}) {
    assert(this.state.isConfigured,'افتح الدفتر أولاً.');
    assert(textField(reason),'سبب التصحيح مطلوب.');

    const d = this.getDeepSnapshot();
    let target;
    let key;

    newVal = validateAmount(
      newVal,
      'قيمة التصحيح',
      targetType !== 'CONFIG'
    );

    if (targetType === 'BUCKET') {
      assert(
        ['operatingCash','protectedCash'].includes(id),
        'وعاء غير صالح.'
      );
      target = d.buckets;
      key = id;
    } else if (targetType === 'CONFIG') {
      assert(id === 'baseDailyBurn','إعداد غير صالح.');
      target = d;
      key = id;
    } else {
      assert(targetType === 'OBLIGATION','نوع غير صالح.');
      target = d.obligations.find(o => o.id === id);
      assert(target,'الدين غير موجود.');
      key = 'outstanding';
    }

    const oldVal = target[key];
    target[key] = newVal;

    d.ledger.push({
      day:d.simDay,
      type:'MANUAL_BALANCE_ADJUSTMENT',
      targetType,
      id,
      oldVal,
      newVal,
      reason:reason.trim(),
      timestamp:new Date().toISOString()
    });

    return this.commit(d);
  }

  commitAudit(a) {
    assert(
      this.state.isConfigured &&
      this.state.dayStatus === 'OPEN',
      'اليوم غير مفتوح للتسجيل.'
    );

    const d = this.getDeepSnapshot();
    const pre = calc(d);
    const day = d.simDay;
    const events = [];

    const inc = cents(a.income,'الدخل');
    const loan = cents(a.cashLoanTaken,'السلفة');
    const credit = cents(a.creditExpenseAdded,'المشتريات بالدين');
    const saved = cents(a.protectedSaved,'المبلغ المعزول');
    const spend = cents(a.spend,'المصروف');

    assert(
      CLASSES.includes(a.spendClassification),
      'تصنيف غير صالح.'
    );

    assert(
      typeof a.cashLoanIsCritical === 'boolean' &&
      typeof a.creditIsCritical === 'boolean',
      'تصنيف الدين غير صالح.'
    );

    let op = cents(d.buckets.operatingCash) + inc + loan;
    let prot = cents(d.buckets.protectedCash);

    cash(op);

    const add = (type,amount,extra={}) => {
      events.push({
        day,
        type,
        amount:cash(amount),
        ...extra
      });
    };

    if (inc) add('INCOME_RECEIVED',inc);

    for (const [amt,isCritical,prefix,title,type] of [
      [
        loan,
        a.cashLoanIsCritical,
        'loan',
        'سلفة نقدية',
        'CASH_LOAN_RECEIVED'
      ],
      [
        credit,
        a.creditIsCritical,
        'cred',
        'شراء بالدين',
        'CREDIT_PURCHASE_INCURRED'
      ]
    ]) {
      if (!amt) continue;

      const id =
        prefix + '_' + day + '_' + Date.now() + '_' +
        Math.random().toString(36).slice(2,9);

      d.obligations.push({
        id,
        title,
        outstanding:cash(amt),
        critical:isCritical
      });

      add(type,amt,{
        critical:isCritical,
        obligationId:id
      });
    }

    assert(saved <= op,'المبلغ المعزول يتجاوز النقد المتاح.');

    op -= saved;
    prot += saved;
    cash(prot);

    if (saved) add('CASH_TRANSFERRED',saved);

    const drain = n => {
      assert(
        n <= op + prot,
        'المصروف أو السداد يتجاوز السيولة المتاحة.'
      );

      const fromOp = Math.min(n,op);
      const fromProt = n - fromOp;

      op -= fromOp;
      prot -= fromProt;

      return {
        operatingDrained:cash(fromOp),
        protectedDrained:cash(fromProt)
      };
    };

    let breakdown = {
      operatingDrained:0,
      protectedDrained:0
    };

    if (spend) {
      breakdown = drain(spend);

      add('EXPENSE_INCURRED',spend,{
        classification:a.spendClassification,
        ...breakdown,
        discretionaryDrainedProtected:
          a.spendClassification === 'DISCRETIONARY' &&
          breakdown.protectedDrained > 0
      });
    }

    let paid = 0;
    let title = '';

    if (a.debtPayment) {
      const amount = cents(
        a.debtPayment.amount,
        'السداد',
        false
      );

      const ob = d.obligations.find(
        o => o.id === a.debtPayment.obligationId
      );

      assert(ob,'الدين غير موجود.');
      assert(
        amount <= cents(ob.outstanding),
        'السداد أكبر من الدين المتبقي.'
      );

      const source = drain(amount);

      ob.outstanding = cash(cents(ob.outstanding) - amount);
      paid = cash(amount);
      title = ob.title;

      add('OBLIGATION_PAID',amount,{
        obligationId:ob.id,
        ...source
      });
    }

    d.buckets.operatingCash = cash(op);
    d.buckets.protectedCash = cash(prot);
    d.dayStatus = 'SEALED';

    events.push({
      day,
      type:'DAILY_AUDIT_COMMITTED',
      timestamp:new Date().toISOString()
    });

    d.ledger.push(...events);

    d.dailySnapshots.push({
      day,
      ...calc(d),
      dayStatus:'SEALED'
    });

    const post = this.commit(d);

    return {
      pre,
      post,
      executedDebtPaid:paid,
      targetObligationTitle:title,
      discretionaryDrainedProtected:
        a.spendClassification === 'DISCRETIONARY' &&
        breakdown.protectedDrained > 0
    };
  }

  nextDay() {
    assert(
      this.state.isConfigured &&
      this.state.dayStatus === 'SEALED',
      'أغلق اليوم أولاً.'
    );

    const d = this.getDeepSnapshot();
    d.simDay++;
    d.dayStatus = 'OPEN';

    return this.commit(d);
  }

  importState(candidate) {
    validateState(candidate);

    const d = clone(candidate);
    calc(d);

    const before = this.storage.getItem(PRIMARY_KEY);

    if (before !== null) {
      this.storage.setItem(RECOVERY_KEY,before);
    }

    const raw = JSON.stringify(d);

    // لا تُعتمد الحالة في الذاكرة إلا بعد نجاح كتابة الدفتر.
    this.storage.setItem(PRIMARY_KEY,raw);

    this.state = d;
    this.expectedRaw = raw;
    this.blocked = false;
  }
}

/* =========================================================
   6. أدوات الواجهة والتنقل
   ========================================================= */

const $ = id => document.getElementById(id);
const esc = escapeHtml;

const fmt = v => new Intl.NumberFormat('en-US',{
  maximumFractionDigits:2
}).format(v);

let engine;
let currentView = 'home';
let tempObligations = [];
let draft = null;
let step = 1;
let chatMessages = [];

const money = v => esc(fmt(v) + ' ' + engine.state.currency);

function message(s,error=false) {
  $('status').textContent = s;
  $('status').className = s ? (error ? 'notice' : 'card') : '';
}

function field(id,label,value='',type='number') {
  return `
    <label for="${id}">${esc(label)}</label>
    <input
      class="input-box"
      id="${id}"
      type="${type}"
      ${type === 'number'
        ? 'min="0" step="0.01" inputmode="decimal"'
        : ''}
      value="${esc(value)}"
    >
  `;
}

function readMoney(id,zero=true) {
  const el = $(id);
  const s = el.value.trim();

  assert(!el.validity.badInput,'رقم غير صالح.');
  assert(s !== '' || zero,'أدخل القيمة المطلوبة.');

  return validateAmount(
    s === '' ? 0 : Number(s),
    'المبلغ',
    zero
  );
}

function run(fn) {
  try {
    message('');
    fn();
  } catch (e) {
    message(e.message,true);
  }
}

function updateTopBar() {
  const s = engine.state;

  $('day-label').textContent = engine.blocked
    ? 'دفتر محمي'
    : s.isConfigured
      ? `اليوم ${s.simDay} · ${s.dayStatus === 'SEALED' ? 'مغلق 🔒' : 'مفتوح'}`
      : 'افتتاح الدفتر';

  $('next-btn').disabled =
    engine.blocked ||
    !s.isConfigured ||
    s.dayStatus !== 'SEALED';

  $('adjust-btn').disabled =
    engine.blocked || !s.isConfigured;

  document.querySelectorAll('#nav button').forEach(b => {
    b.disabled = engine.blocked;
    b.classList.toggle(
      'active',
      b.dataset.view === currentView
    );
  });
}

function switchView(v) {
  if (engine.blocked) return;

  currentView = v;
  message('');
  updateTopBar();

  if (!engine.state.isConfigured) {
    renderSetupWizard();
    return;
  }

  if (v === 'home') renderHome();
  else if (v === 'audit') openAudit();
  else if (v === 'ledger') renderLedgerView();
  else if (v === 'advisor') renderAdvisorChat();
  else renderHarvestCard();
}

  $('obs').innerHTML = tempObligations.map((o,i) => `
    <div class="row between card">
      <span>
        ${esc(o.title)} · ${money(o.outstanding)}
        ${o.critical ? '· عاجل' : ''}
      </span>

        aria-label="حذف الدين"
      >×</button>
    </div>
  `).join('') || '<p class="muted">لا توجد ديون مضافة.</p>';
}

function addTempObligation() {
  run(() => {
    const title = $('title').value.trim();

    assert(
      textField(title,200),
      'اكتب اسم دين لا يتجاوز 200 حرف.'
    );

    tempObligations.push({
      id:'ob_' + Date.now() + '_' +
        Math.random().toString(36).slice(2,9),
      title,
      outstanding:readMoney('amt',false),
      critical:$('critical').checked
    });

    $('title').value = '';
    $('amt').value = '';
    $('critical').checked = false;

    renderTempObligationsList();
  });
}

function removeTempObligation(i) {
  tempObligations.splice(i,1);
  renderTempObligationsList();
}

function saveInitialSetup() {
  run(() => {
    assert(
      !$('title').value.trim() &&
      !$('amt').value.trim(),
      'يوجد دين مكتوب لم تضفه. اضغط إضافة دين أولاً أو امسح حقوله.'
    );

    engine.setup(
      readMoney('op'),
      readMoney('burn',false),
      readMoney('prot'),
      tempObligations
    );

    switchView('home');
  });
}

          .filter(o => o.outstanding > 0)

  $('app').innerHTML = `
    <span class="tag">تسكيرة المساء · ${step} من 4</span>
    <div class="card">${body}</div>

    <div class="row">
      ${step > 1
        ? '<button onclick="auditBack()">رجوع</button>'
        : ''}

      <button class="primary" onclick="auditNext()">
        ${step === 4 ? 'تسكير اليوم وحفظ السجل' : 'المتابعة'}
      </button>
    </div>
  `;
}

function collectStep() {
  if (step === 1) {
    draft.income = readMoney('income');
  }

  if (step === 2) {
    draft.protectedSaved = readMoney('saved');
  }

  if (step === 3) {
    draft.spend = readMoney('spend');
    draft.spendClassification = $('classification').value;
  }

  if (step === 4) {
    const id = $('debt').value;
    const raw = $('paid').value.trim();

    assert(
      (id === '' && raw === '') ||
      (id !== '' && raw !== ''),
      'حدد الدين والمبلغ معاً أو اتركهما فارغين.'
    );

    draft.debtPayment = id
      ? {
          obligationId:id,
          amount:readMoney('paid',false)
        }
      : null;

    draft.cashLoanTaken = readMoney('loan');
    draft.creditExpenseAdded = readMoney('credit');
    draft.cashLoanIsCritical = $('loancritical').checked;
    draft.creditIsCritical = $('creditcritical').checked;
  }
}

function auditBack() {
  run(() => {
    collectStep();
    step--;
    renderAudit();
  });
}

function auditNext() {
  run(() => {
    collectStep();

    if (step < 4) {
      step++;
      renderAudit();
      return;
    }

    const result = engine.commitAudit(draft);
    updateTopBar();
    renderImpactSeal(result);
  });
}

function renderImpactSeal(r) {
  const delta =
    Math.round(
      (r.pre.criticalGap - r.post.criticalGap) * 100
    ) / 100;

  const detail =
    r.pre.criticalGap > 0 || r.post.criticalGap > 0
      ? `الفجوة الحالية: ${money(r.post.criticalGap)}.
         ${
           delta > 0
             ? 'انخفضت بمقدار ' + money(delta)
             : delta < 0
               ? 'ارتفعت بمقدار ' + money(-delta)
               : 'لم تتغير.'
         }`
      : `أيام الأمان: ${esc(fmt(r.post.safetyDays))} يوم.
         قبل تسجيل هذه العملية:
         ${esc(fmt(r.pre.safetyDays))} يوم.`;

  $('app').innerHTML = `
    <h2>🛡️ أُغلق اليوم وحُفظ السجل</h2>
    <div class="card">${detail}</div>

    ${r.executedDebtPaid ? `

    <button class="primary wide" onclick="switchView('home')">

function advisor(q) {
  const c = calc(engine.state);
  const s = engine.state;
  const u = s.currency;

  const numbers =
    `كاش الجيبة: ${fmt(s.buckets.operatingCash)} ${u}\n` +
    `الاحتياطي: ${fmt(s.buckets.protectedCash)} ${u}\n` +
    `الديون: ${fmt(c.debtBurden)} ${u}، ` +
    `العاجل منها: ${fmt(c.criticalDue)} ${u}\n` +
    `الفجوة: ${fmt(c.criticalGap)} ${u}\n` +
    `أيام الأمان التقديرية: ${fmt(c.safetyDays)} يوم.\n\n`;

  if (/حلل|وضعي|تشخيص|تقرير/.test(q)) {
    return numbers + (
      c.criticalGap > 0
        ? 'السيولة لا تغطي الالتزامات العاجلة المسجلة. راجع مواعيدها واحتياجات البيت لتحديد الخيارات المتاحة.'
        : c.safetyDays === 0
          ? 'لا يتبقى احتياطي حر بعد حجز الالتزامات العاجلة.'
          : `هذا المؤشر يفترض استمرار المصروف اليومي عند ${fmt(s.baseDailyBurn)} ${u}. لا يشمل استحقاقات مستقبلية غير مصنفة كعاجلة ولا يثبت ملاءمة أي استثمار.`
    );
  }

  if (/دين|ديون|سداد/.test(q)) {
    return numbers +
      'السداد من النقد يخفض السيولة والدين معاً. سداد دين عاجل لا يصنع وحده تحسناً في الفجوة. حدّد دفعة تتناسب مع الاحتياجات الفعلية والاتفاق مع الدائن.';
  }

  if (/دخل|شغل|تسويق/.test(q)) {
    return 'راجع الخدمات التي تقدمها بالفعل، وتكلفتها وصافي ربحها والطلب عليها. هذه أفكار عامة، وليست توقعاً بزيادة الدخل.';
  }

  if (/عادة|توفير|قرش/.test(q)) {
    return 'سجّل ما حدث فعلاً، واعزل مبلغاً فقط إن سمحت الضروريات. نقل المال من الجيبة إلى الاحتياطي لا يرفع أيام الأمان وحده.';
  }

  return 'أستطيع شرح الأرقام المسجلة بقواعد ثابتة. اختر تحليل الوضع أو شرح الديون؛ لا أفهم جميع الأسئلة الحرة كمساعد ذكاء اصطناعي.';
}

function downloadText(raw,name) {
  const blob = new Blob([raw],{
    type:'application/json'
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = name;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url),1000);
}

function exportBackupData() {

    assert(

    downloadText(raw,'haseef-backup.json');
  });
}

function exportRecovery() {
  run(() => {
    const keys = [
      PRIMARY_KEY,
      RECOVERY_KEY,
      'sanad_v1_john_data',
      'wealthos_v15_john_complete',
      'wealthos_john_data'
    ];

    const records = [];

    for (const key of keys) {
      const raw = engine.storage.getItem(key);
      if (raw !== null) records.push({key,raw});
    }

    assert(records.length,'لا توجد بيانات قابلة للتصدير.');

    downloadText(
      JSON.stringify({
        recoveryOnly:true,
        records
      },null,2),
      'haseef-recovery-raw.json'
    );

    message(
      'حُفظت نسخة إنقاذ خام للاحتفاظ بها ومعالجتها؛ لا تُستورد كدفتر مباشرة.'
    );
  });
}

async function handleBackupFile(event) {
  const input = event.target;
  const file = input.files?.[0];

  if (!file) return;

  try {
    assert(
      file.size <= 10 * 1024 * 1024,
      'الملف أكبر من 10 ميغابايت.'
    );

    const raw = await file.text();
    let parsed;

    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      throw new Error('الملف ليس JSON صالحاً.');
    }

    const candidate = migrateLegacyState(parsed);
    const c = calc(candidate);

    const approved = confirm(
      'سيستبدل هذا الملف الدفتر الحالي.\n' +
      `السيولة: ${fmt(c.totalLiquid)} ${candidate.currency}\n` +
      `الديون: ${fmt(c.debtBurden)} ${candidate.currency}\n` +
      `أيام الأمان: ${fmt(c.safetyDays)}\n` +
      `الحركات: ${candidate.ledger.length}\n` +
      (
        candidate.historyIncomplete
          ? 'التاريخ المرحّل قد يكون غير مكتمل.\n'
          : ''
      ) +
      'هل تريد المتابعة؟'
    );

    if (!approved) return;

    engine.importState(candidate);

    draft = null;
    chatMessages = [];

    switchView('home');

    message(
      'تم الاستيراد. احتُفظ بالدفتر السابق محلياً إن كان موجوداً.'
    );
  } catch (e) {
    message('لم يكتمل الاستيراد: ' + e.message,true);
  } finally {
    input.value = '';
  }
}

];

function checkPlanningProfile(p) {
  assert(object(p),'بيانات الخطة غير صالحة.');

  for (const [key,label,type] of PLAN_FIELDS) {
    const v = p[key];

    if (
      v === null ||
      v === undefined ||
      v === ''
    ) {
      continue;
    }

    if (type === 'money') {
      cents(v,label);
    } else if (type === 'hours') {
      assert(
        Number.isFinite(v) && v >= 0 && v <= 168,
        'الساعات يجب أن تكون بين 0 و168.'
      );
    } else if (type === 'select') {
      assert(
        ['stable','variable'].includes(v),
        'طبيعة الدخل غير صالحة.'
      );
    } else if (type === 'date') {
      assert(
        /^\d{4}-\d{2}-\d{2}$/.test(v) &&
        !isNaN(Date.parse(v)) &&
        new Date(v).toISOString().slice(0,10) === v,
        'تاريخ غير صالح.'
      );
    } else {
      assert(
        typeof v === 'string' && v.length <= 1000,
        label + ': نص طويل أو غير صالح.'
      );
    }
  }

  if (p.updatedAt) {
    assert(
      timestamp(p.updatedAt),
      'تاريخ تحديث بيانات الخطة غير صالح.'
    );
  }
}

        لا يُعد الدخل القادم نقداً متاحاً حتى تقبضه
        وتسجله في التسكيرة.
        التزامات الشهر تقدير إجمالي؛
        تحديد التواريخ التفصيلية مطلوب قبل اعتماد جدول سداد.
      </p>

      <div class="row">
        <button onclick="switchView('advisor')">رجوع</button>

        <button class="primary" onclick="savePlanningProfile()">
          حفظ وبناء الخطة المتقدمة
        </button>
      </div>
    `;
  });
}

function savePlanningProfile() {
  run(() => {
    const p = {};

    for (const [key,label,type] of PLAN_FIELDS) {
      const el = $('plan-' + key);
      const raw = el.value.trim();

      assert(
        !el.validity.badInput,
        label + ': إدخال غير صالح.'
      );

      p[key] = raw === ''
        ? null
        : type === 'money'
          ? validateAmount(Number(raw),label)
          : type === 'hours'
            ? Number(raw)
            : raw;
    }

    p.updatedAt = new Date().toISOString();
    checkPlanningProfile(p);

    const d = engine.getDeepSnapshot();
    d.planningProfile = p;

    engine.commit(d);

    showReportCenter('advanced');

    message(
      'حُفظت بيانات التخطيط. راجع الافتراضات قبل اعتماد الخطة.'
    );
  });
}

/* =========================================================
   15. بناء الخطة الأساسية والمتقدمة
   ========================================================= */

function buildPersonalPlan(state,advanced=false) {
  const s = clone(state);
  validateState(s);

  const c = calc(s);
  const p = s.planningProfile || {};
  const missing = [];

  for (const [key,label] of PLAN_FIELDS) {
    if (
      p[key] === null ||
      p[key] === undefined ||
      p[key] === ''
    ) {
      missing.push(label);
    }
  }

  const financialReady = [
    'monthlyIncome',
    'fixedCosts',
    'debtInstallments'
  ].every(k => typeof p[k] === 'number');

  let monthly = null;

  if (financialReady) {
    const daily30 = cents(s.baseDailyBurn) * 30;

    assert(
      Number.isSafeInteger(daily30),
      'المصروف الشهري خارج الحدود.'
    );

    const total =
      daily30 +
      cents(p.fixedCosts) +
      cents(p.debtInstallments);

    assert(
      Number.isSafeInteger(total),
      'مجموع المصاريف خارج الحدود.'
    );

    monthly = {
      daily30:daily30 / 100,
      total:total / 100,
      net:(cents(p.monthlyIncome) - total) / 100
    };
  }

  const priority =
    c.criticalGap > 0
      ? 'توضيح العجز العاجل وحماية الضروريات'
      : c.safetyDays < 1
        ? 'تأمين احتياجات اليوم وبناء أول يوم احتياطي'
        : c.safetyDays < 7
          ? 'المحافظة على التغطية وتحديد الالتزامات القادمة'
          : 'مراجعة الاستحقاقات والمحافظة على الاحتياطي';

  const actions = [
    [
      'خلال 24 ساعة',
      'راجع النقد الموجود فعلياً، وافصل الدين العاجل عن المؤجل. لا تسجل دخلاً متوقعاً كنقد مقبوض.',
      'تأكيد الأرصدة وأسماء الالتزامات ومواعيدها'
    ],
    [
      'الأيام 2–3',
      c.criticalGap > 0
        ? 'حدّد مواعيد المطالبات العاجلة وناقش الخيارات المتاحة مع الدائن، دون اعتبار التأجيل محققاً قبل الاتفاق.'
        : 'راجع الضروريات الفعلية ومصاريف الأسبوع قبل عزل أي مبلغ.',
      'قائمة بالضروريات والاستحقاقات دون ازدواج'
    ],
    [
      'الأيام 4–7',
      'سجّل ما حدث فعلاً، ثم قارن أيام الأمان والفجوة مع بداية الخطة. نقل المال للاحتياطي وحده لا يزيد الأمان.',
      'مراجعة واحدة في نهاية الأسبوع'
    ]
  ];

  const roadmap = advanced ? [
    [
      'الأسبوع 1',
      'تثبيت البيانات',
      actions[0][1] + ' ' + actions[1][1],
      'أرصدة مؤكدة وقائمة استحقاقات'
    ],
    [
      'الأسبوع 2',
      'اختبار خطوة دخل صغيرة',
      p.work &&
      p.skills &&
      typeof p.weeklyHours === 'number' &&
      p.weeklyHours > 0
        ? `استناداً إلى عملك «${p.work}» ومهاراتك «${p.skills}»، اختر خدمة واحدة تستطيع تنفيذها ضمن ${p.weeklyHours} ساعة متاحة أسبوعياً. حدّد تكلفتها وجرّب عرضها على عميل مناسب دون التزام بإنفاق جديد.`
        : 'أكمل بيانات العمل والمهارات والوقت قبل تحديد نشاط إضافي. إذا لم يتوفر وقت إضافي، ركز على تنظيم العمل الحالي.',
      'تسجيل الوقت والتكلفة والنتيجة الفعلية؛ لا يُفترض وجود مبيعات'
    ],
    [
      'الأسبوع 3',
      'مراجعة قابلية الخطة',
      monthly
        ? monthly.net < 0
          ? 'التقدير الشهري يظهر عجزاً. راجع البنود والدخل وتوقيت الاستحقاقات؛ لا تضع قسطاً إضافياً أو هدف ادخار إلزامياً.'
          : 'الفائض الشهري تقديري وليس نقداً جاهزاً. تأكد من التحصيل والاستحقاقات قبل تخصيصه.'
        : 'أكمل الدخل والمصاريف والأقساط قبل حساب تخصيص مالي.',
      'مقارنة المتوقع بما تحقق فعلياً'
    ],
    [
      'الأسبوع 4',
      'قرار الاستمرار أو التعديل',
      'راجع تغير السيولة والديون وأيام الأمان. كرر الخطوة المجدية أو عدّلها بناء على النتيجة، ثم أصدر خطة محدثة.',
      'قرار واحد واضح للشهر التالي'
    ]
  ] : [];

  return {
    createdAt:new Date().toISOString(),
    state:s,
    metrics:c,
    profile:p,
    priority,
    missing,
    monthly,
    actions,
    roadmap,
    advanced
  };
}

/* =========================================================
   17. تنزيل التقارير وعرض PDF
   ========================================================= */

function downloadReadableReport(kind) {
  run(() => {
    const doc = reportDocument(kind);

    const blob = new Blob([doc],{
      type:'text/html;charset=utf-8'
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

    a.href = url;
    a.download =
      `haseef-${kind}-${new Date().toISOString().slice(0,10)}.html`;

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url),2000);

    message(
      'تم تجهيز التقرير للتحميل كملف HTML مقروء. افتحه في المتصفح، ومنه يمكنك الطباعة أو الحفظ PDF.'
    );
  });
}

function openPrintableReport(kind) {
  run(() => {
    const html = reportDocument(kind);
    const w = window.open('','_blank');

    assert(
      w,
      'اسمح بفتح نافذة التقرير أو استخدم تنزيل التقرير المقروء.'
    );

    w.document.open();
    w.document.write(html);
    w.document.close();

    message(
      'فُتح التقرير. اضغط «طباعة / حفظ PDF» واختر وجهة PDF.'
    );
  });
}

            تنزيل ملف مقروء
          </button>

          <button onclick="openPrintableReport('${kind}')">
            عرض / حفظ PDF
          </button>
        </div>
      </div>
    `).join('') + `
      <button class="primary wide" onclick="showPlanningForm()">
        استكمال بيانات الخطة المتقدمة
      </button>

      <button
        class="wide"
        onclick="switchView('advisor')"
        style="margin-top:10px"
      >
        العودة للمساعد
      </button>
    `;
  });
}

/* =========================================================
   19. ربط الخطط بالمساعد
   ========================================================= */

const originalAdvisorView = renderAdvisorChat;

renderAdvisorChat = function() {
  originalAdvisorView();

  const box = document.createElement('div');
  box.className = 'card';

  box.innerHTML = `
    <h3>حوّل أرقامك إلى خطوات واضحة</h3>

    <div class="row">
      <button class="primary" onclick="showReportCenter('basic')">
        نزّل خطتي المالية
      </button>

      <button onclick="showPlanningForm()">
        ابنِ خريطة عملي
      </button>
    </div>

    <p class="muted">
      الخطة مبنية على بياناتك المتاحة وتوضح ما ينقصها.
    </p>
  `;

  $('app').prepend(box);
};

/* =========================================================
   20. فصل التقارير عن النسخ الاحتياطي
   ========================================================= */

const originalBoot = boot;

boot = function() {
  originalBoot();

  const exportButton = document.querySelector(
    'button[onclick="exportBackupData()"]'
  );

  if (exportButton) {
    exportButton.textContent = '📄 التقارير';
    exportButton.onclick = () => showReportCenter();
  }

  const advanced = document.createElement('details');

  advanced.innerHTML = `
    <summary>النسخ الاحتياطي والاستعادة</summary>

    <p class="muted">
      JSON للاستعادة البرمجية، وليس تقرير القراءة.
      التقارير المقروءة لا تستعيد بيانات التطبيق.
    </p>

    <div class="row">
      <button onclick="exportBackupData()">
        تنزيل نسخة JSON
      </button>

      <button onclick="$('import-file').click()">
        استعادة JSON
      </button>

      <button onclick="exportPrior()">
        النسخة السابقة للاستيراد
      </button>
    </div>
  `;

  document.querySelector('.container').appendChild(advanced);

  const importButton = document.querySelector(
    'header button[onclick*="import-file"]'
  );

  if (importButton) {
    importButton.style.display = 'none';
  }

  document.querySelectorAll('.container > button').forEach(b => {
    if (b.textContent === 'تصدير النسخة السابقة للاستيراد') {
      b.remove();
    }
  });
};

/* =========================================================
   21. التشغيل
   ========================================================= */

if (
  typeof window !== 'undefined' &&
  !window.__HASEEF_TEST__
) {
  try {
    boot();
  } catch (e) {
    $('app').textContent =
      'تعذر الوصول للتخزين المحلي. افتح الملف في متصفح يسمح بالحفظ، أو فعّل التخزين ثم أعد المحاولة.';

    document.querySelectorAll('button').forEach(b => {
      b.disabled = true;
    });
  }
}
</script>
</body>
</html>
